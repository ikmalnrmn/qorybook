name: Perbarui katalog

on:
  schedule:
    - cron: "0 19 * * *" # 02.00 WIB setiap hari
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["catalog/**", ".github/workflows/catalog.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Bangun catalog.json
        working-directory: catalog
        run: |
          # Pakai katalog yang sudah terbit agar halaman detail BUDI tidak diambil ulang;
          # saat pertama kali, pakai katalog bawaan aplikasi.
          curl -fsSL "${{ steps.pages.outputs.base_url }}/catalog.json" -o prev.json \
            || cp ../app/assets/catalog.json prev.json
          python build_catalog.py --out site/catalog.json --prev prev.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}catalog.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
